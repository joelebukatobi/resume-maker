<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Applications · Resume Maker</title>
<script src="/static/ui/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..500&family=Geist+Mono:wght@400&display=swap">
<link rel="stylesheet" href="/static/ui/tokens.css">
<link rel="stylesheet" href="/static/ui/reset.css">
<link rel="stylesheet" href="/static/ui/atoms.css">
<link rel="stylesheet" href="/static/ui/layout.css">
<script type="module" src="/static/ui/app-nav.js"></script>
<script type="module" src="/static/ui/apps-page.js"></script>
</head>
<body data-page="">
<div class="shell">
  <app-nav current="applications">
    <div data-slot="middle" class="apps-toolbar">
      <button class="btn btn-sm btn-primary app-new" type="button" id="app-new" aria-label="Start Application">
        <span class="app-new-icon" aria-hidden="true"></span>
        <span class="app-new-label">Start Application</span>
      </button>
      <div class="apps-search">
        <label class="visually-hidden" for="search">Search applications</label>
        <input class="input input-sm" id="search" type="search" placeholder="Search applications">
        <button class="apps-search-go" type="button" id="search-go" aria-label="Search"></button>
      </div>
    </div>
  </app-nav>

  <main class="main">
    <h1 class="visually-hidden">Applications</h1>

    <div class="notice nudge" id="nudge" hidden></div>

    <table class="table">
      <thead>
        <tr>
          <th scope="col" class="eyebrow">Company</th>
          <th scope="col" class="eyebrow">Application</th>
          <th scope="col" class="eyebrow col-track">Track</th>
          <th scope="col" class="eyebrow col-date">Created</th>
          <th scope="col" class="eyebrow col-link">Posting</th>
          <th scope="col" class="col-actions"><span class="visually-hidden">Actions</span></th>
        </tr>
      </thead>
      <tbody id="app-rows"></tbody>
    </table>

    <nav class="apps-pager" id="apps-pager" aria-label="Applications pages" hidden>
      <button class="icon-btn apps-pager-btn" type="button" id="apps-prev" aria-label="Previous page"></button>
      <span class="apps-pager-page" id="apps-page">1</span>
      <button class="icon-btn apps-pager-btn" type="button" id="apps-next" aria-label="Next page"></button>
    </nav>
  </main>
</div>
</body>
</html>
