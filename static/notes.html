<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes · Resume Maker</title>
<script src="/static/ui/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..500&family=Geist+Mono:wght@400&display=swap">
<link rel="stylesheet" href="/static/ui/tokens.css">
<link rel="stylesheet" href="/static/ui/reset.css">
<link rel="stylesheet" href="/static/ui/atoms.css">
<link rel="stylesheet" href="/static/ui/layout.css">
<script type="module" src="/static/ui/app-nav.js"></script>
<script type="module" src="/static/ui/notes-page.js"></script>
</head>
<body data-page="">
<div class="shell">
  <app-nav current="notes">
    <div data-slot="middle" class="nav-search">
      <label class="visually-hidden" for="search">Search notes</label>
      <input class="input input-sm" id="search" type="search" placeholder="Search notes">
    </div>
    <button class="btn btn-sm" type="button" id="download">Download</button>
    <button class="btn btn-sm btn-primary" type="button" id="save">Save</button>
  </app-nav>

  <div class="page">
    <main class="main">
      <div class="measure">
        <header class="page-head">
          <h1 class="title">Notes</h1>
          <p class="lead">What you have done, in your words.</p>
        </header>

        <p class="meta search-note" id="search-note" hidden></p>

        <section class="doc" aria-label="notes.md">
          <div class="doc-bar">
            <span class="mono doc-name">notes.md</span>
            <div class="segment" role="group" aria-label="View">
              <button type="button" data-mode="preview" aria-pressed="true">Preview</button>
              <button type="button" data-mode="markdown" aria-pressed="false">Markdown</button>
            </div>
          </div>
          <div class="doc-body md" id="preview"></div>
          <label class="visually-hidden" for="source">notes.md as markdown</label>
          <textarea class="doc-body doc-source" id="source" spellcheck="false" hidden></textarea>
        </section>

        <section class="chat" id="chat" aria-label="Ask the assistant"></section>
      </div>
    </main>

    <aside class="rail" aria-label="File">
      <section class="rail-block">
        <p class="eyebrow">File</p>
        <div class="rows">
          <div><span>State</span><span class="meta" id="fact-state">…</span></div>
          <div><span>Size</span><span class="meta tnum" id="fact-size">…</span></div>
          <div><span>Changes</span><span class="meta" id="fact-saved">…</span></div>
        </div>
      </section>

      <section class="rail-block">
        <p class="eyebrow">Used by</p>
        <div class="rows">
          <div>Every chat</div>
          <div>Line checks</div>
          <div>Gap questions</div>
        </div>
      </section>

      <section class="rail-block">
        <p class="eyebrow">Lines</p>
        <a class="btn btn-sm" href="/review">Review your lines</a>
      </section>
    </aside>
  </div>
</div>
</body>
</html>
