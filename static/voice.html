<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tone · Resume Maker</title>
<script src="/static/ui/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..500&family=Geist+Mono:wght@400&display=swap">
<link rel="stylesheet" href="/static/ui/tokens.css">
<link rel="stylesheet" href="/static/ui/reset.css">
<link rel="stylesheet" href="/static/ui/atoms.css">
<link rel="stylesheet" href="/static/ui/layout.css">
<script type="module" src="/static/ui/app-nav.js"></script>
<script type="module" src="/static/ui/voice-page.js"></script>
</head>
<body data-page="">
<div class="shell">
  <app-nav current="voice">
    <div data-slot="middle" class="apps-search">
      <label class="visually-hidden" for="search">Search Tone</label>
      <input class="input input-sm" id="search" type="search" placeholder="Search Tone">
      <button class="apps-search-go" type="button" id="search-go" aria-label="Search"></button>
    </div>
  </app-nav>

  <div class="page">
    <main class="main">
      <div class="measure">
        <header class="page-head">
          <h1 class="title">Tone</h1>
          <p class="lead">How every application should sound, taste, rules, and what to avoid.</p>
        </header>

        <p class="meta search-note" id="search-note" hidden></p>

        <section class="doc" aria-label="Tone">
          <div class="doc-bar">
            <div class="doc-view" role="group" aria-label="View">
              <button type="button" class="doc-view-btn" data-mode="preview" aria-pressed="true">Preview</button>
              <button type="button" class="doc-view-btn" data-mode="markdown" aria-pressed="false">Markdown</button>
            </div>
            <div class="doc-bar-end">
              <button class="doc-action" type="button" id="save">Save</button>
              <button class="icon-btn doc-more" type="button" id="starters-trigger"
                aria-label="Starters" aria-haspopup="listbox" aria-expanded="false"></button>
              <div class="select-menu" role="listbox" popover="manual" id="starters-menu"></div>
            </div>
          </div>
          <div class="doc-body md thin-scroll" id="preview"></div>
          <label class="visually-hidden" for="source">Tone as markdown</label>
          <textarea class="doc-body doc-source thin-scroll" id="source" spellcheck="false" hidden></textarea>
        </section>

        <section class="chat" id="chat" aria-label="Ask about your tone"></section>
      </div>
    </main>
  </div>
</div>
</body>
</html>
