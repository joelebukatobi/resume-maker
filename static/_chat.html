<aside id="chat" class="chat" aria-label="Chat">
  <div class="chat-head">
    <strong id="chat-title">Chat</strong>
    <span class="chat-head-actions">
      <button type="button" class="chat-link" id="agent-link">Connect Agent</button>
      <button type="button" class="chat-link" id="chat-clear">Clear</button>
    </span>
  </div>
  <div id="import-bar" class="import-bar" hidden>
    <span>Imported document ready to apply</span>
    <button type="button" class="tiny" id="import-accept">Accept</button>
    <button type="button" class="tiny secondary" id="import-discard">Discard</button>
  </div>
  <div id="chat-log" class="chat-log" aria-live="polite"></div>
  <div class="chat-tiles">
    <div class="tile" id="jd-tile">
      <textarea id="jd-input" aria-label="Job description" placeholder="Paste Job Description"></textarea>
      <div class="tile-chip" id="jd-chip" hidden>
        <span class="tile-tag">Pasted</span>
        <p id="jd-preview"></p>
        <span class="tile-meta" id="jd-meta"></span>
      </div>
      <button type="button" class="tile-x" id="jd-clear" aria-label="Remove job description" hidden><svg class="ico" aria-hidden="true"><use href="#i-xmark"/></svg></button>
    </div>
    <div class="tile" id="cv-tile" role="button" tabindex="0" aria-label="Upload a document to import">
      <input type="file" id="cv-file" accept=".docx,.pdf,.txt" hidden>
      <span class="tile-empty" id="cv-empty"><span id="cv-empty-label">Upload CV</span></span>
      <span class="tile-doc" id="cv-doc" hidden><span id="cv-doc-name"></span></span>
      <button type="button" class="tile-x" id="cv-clear" aria-label="Remove document" hidden><svg class="ico" aria-hidden="true"><use href="#i-xmark"/></svg></button>
    </div>
  </div>
  <div class="chat-compose">
    <textarea id="chat-input" rows="3" placeholder="Ask anything about your documents"></textarea>
    <button type="button" class="chat-icon chat-mic" id="chat-mic" aria-label="Dictate" title="Dictate"><svg class="ico" aria-hidden="true"><use href="#i-microphone"/></svg></button>
    <button type="button" class="chat-icon" id="chat-send" aria-label="Send"><svg class="ico" aria-hidden="true"><use href="#i-send-diagonal"/></svg></button>
    <button type="button" class="chat-icon" id="chat-stop" aria-label="Stop" hidden><svg class="ico" aria-hidden="true"><use href="#i-square"/></svg></button>
  </div>
</aside>
<input id="name" type="hidden" value="">
<dialog id="agent-dialog">
  <article>
    <header class="dialog-head"><strong>Agent</strong>
      <button type="button" class="chat-link" id="agent-close" aria-label="Close"><svg class="ico" aria-hidden="true"><use href="#i-xmark"/></svg></button></header>
    <p class="status">Pick a provider and paste its API key. The key is checked, then kept on this machine only.</p>
    <div class="agent-providers" id="agent-providers"></div>
    <label for="agent-key">API key</label>
    <input type="password" id="agent-key" autocomplete="off" spellcheck="false">
    <label for="agent-model">Model</label>
    <select id="agent-model"></select>
    <p class="status" id="agent-note"></p>
    <footer class="dialog-foot">
      <button type="button" class="secondary" id="agent-disconnect">Disconnect</button>
      <span class="spacer"></span>
      <button type="button" id="agent-connect">Connect</button>
      <button type="button" id="agent-done">Done</button>
    </footer>
  </article>
</dialog>
<dialog id="jd-dialog">
  <article>
    <header class="dialog-head"><strong>Job description</strong>
      <button type="button" class="chat-link" id="jd-dialog-close" aria-label="Close"><svg class="ico" aria-hidden="true"><use href="#i-xmark"/></svg></button></header>
    <textarea id="jd-full" rows="16"></textarea>
  </article>
</dialog>
